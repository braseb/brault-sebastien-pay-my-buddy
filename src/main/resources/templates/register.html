<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="/style/header.css">
		<title>Transactions</title>
		
	</head>
	
	<body>
		<div th:replace="~{fragments/header :: header}">...</div>
		<h1 th:text="#{appli.title}"></h1>
		<form th:action=@{/register} method="post" class="formulaire">
			<input type="text" id="username" name="username" autocomplete="username" autofocus="autofocus" placeholder="username"/><br>
			<input type="email" id="email" name="email" autocomplete="email" placeholder="Mail"/><br>
			<input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mot de passe"/><br>
			<input type="submit" value="S'inscrire"/>
		</form>
		
		
		
	</body>
</html>
