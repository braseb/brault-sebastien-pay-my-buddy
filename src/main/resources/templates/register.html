<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="/style/header.css">
		<link rel="stylesheet" href="/style/login.css">
		<link rel="stylesheet" href="/style/message.css">
		<title>Register</title>
		
	</head>
	
	<body>
		<div th:replace="~{fragments/header :: header}">...</div>
		<main>
			<form th:action=@{/register} method="post" class="formulaire" th:object="${userDto}">
				<h1 id="titre" th:text="#{appli.title}"></h1>
				<input type="hidden" name="from" value="register">
				<div id="inputFormulaire">
					<div class="messageError" th:if="${globalError}" th:text="${globalError}"></div>
					<div class="messageError" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
					<input class="input" th:field="*{username}" type="text" id="username" name="username" autocomplete="username" autofocus="autofocus" placeholder="username"/><br>
					<div class="messageError" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
					<input class="input" th:field="*{email}" type="email" id="email" name="email" autocomplete="email" placeholder="Mail"/><br>
					<div class="messageError" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
					<input class="input" th:field="*{password}" type="password" id="password" name="password" autocomplete="new-password" placeholder="Mot de passe"/><br>
					
					
				</div>
				<input id="submiButton" type="submit" value="S'inscrire"/>
			</form>
		</main>
		
		
		
	</body>
</html>
