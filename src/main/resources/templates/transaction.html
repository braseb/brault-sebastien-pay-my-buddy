<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="/style/header.css">
		<link rel="stylesheet" href="/style/transaction.css">
		<title>Transactions</title>
		
	</head>
	
	<body>
		<div th:replace="~{fragments/header :: header}">...</div>
		<div th:if="globalError">
			<p th:text="${globalError}"></p>
		</div>
		<form class="formulaire-transaction" th:action="@{/transaction}" method="post">
			<!--  <select th:field="${connectionSelect}">-->
			<!--  <label for="emailSelect">Sélectionner une relation :</label>-->
			<select id = "emailSelect" name = "emailSelect">
				<option class="selectRelation" selected disabled value="">Sélectionner une relation</option>
				<option class="selectRelation" th:each=" mail: ${listEmail}" th:value="${mail}" th:text="${mail}"></option>
			</select>
			<input type="text" id="description" name="description" placeholder="Description" />
			<div class="montant">
				   <input type="number" id="amount" name="amount" placeholder="0" min="0.01" step="0.01">
				     <span>€</span>
				    
				  
			</div>
			<input id="pay-button" type="submit" value="Payer">
		</form>
		<br/>
		<div class="tableau">
			<h2>Mes transactions</h2>
			<table class="tableau-transactions">
				<thead>
					<tr>
						<th>Relations</th>
						<th>Description</th>
						<th>Montant</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="transaction : ${transactions}">
						<!-- <td colspan="3" th:text="${transaction}"></td>-->
						<td th:text="${transaction.username}"></td> 
						<td th:text="${transaction.description}"></td>
						<td th:text="${transaction.amount}"></td> 
							
					</tr>
				</tbody>
			</table>
		</div>
	</body>
</html>
