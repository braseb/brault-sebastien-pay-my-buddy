<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="/style/header.css">
		<title>Transactions</title>
		
	</head>
	
	<body>
		<div th:replace="~{fragments/header :: header}">...</div>
		<h1 th:text="#{appli.title}"></h1>
		<form th:action="@{/profile}" method="post" th:object="${user}">
    		<input type="hidden" name="_method" value="put"/>
    		<label for="username">Username</label>
			<input type="text" id="Username" name="username" autocomplete="username" th:field="*{username}"/><br>
			<label for="email">Mail</label>
			<input type="email" id="email" name="email" autocomplete="email" th:field="*{email}"/><br>
			<label for="password">Mot de passe</label>
			<input type="password" id="password" name="password"  placeholder="mot de passe" autocomplete="current-password" th:field="*{password}"/><br>
    		<input type="submit" name="Modifier" value="Modifier" />
		</form>
		
		
		
	</body>
</html>
