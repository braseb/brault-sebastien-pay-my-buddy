<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="/style/header.css">
		<link rel="stylesheet" href="/style/login.css">
		<title>Login</title>
		
	</head>
	
	<body>
		<div th:replace="~{fragments/header :: header}">...</div>
		<main>
			<h1 th:text="#{appli.title}"></h1>
			<div th:if="${param.error}">
	    		<p style="color: red;">Email ou mot de passe invalide.</p>
			</div>
			<div th:if="${param.logout}">
				You have been logged out.
			</div>
			<form th:action=@{/login} method="post" class="formulaire">
				<label for="email">Email</label>
				<input type="email" id="email" name="email" autocomplete="email" autofocus="autofocus"/><br>
				<label for="password">Password</label>
				<input type="password" id="password" name="password" autocomplete="current-password"/><br>
				<input type="submit" value="login"/>
			</form>
		</main>
	</body>
</html>
