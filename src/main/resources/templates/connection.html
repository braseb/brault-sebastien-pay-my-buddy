<!DOCTYPE html>

<html lang="fr" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="/style/header.css">
		<link rel="stylesheet" href="/style/connection.css">
		<link rel="stylesheet" href="/style/message.css">
		<title>Connection</title>
		
	</head>
	
	<body>
		<div th:replace="~{fragments/header :: header}">...</div>
		<h1>Connexion</h1>
		<main>	
			<form class="formulaire" th:action="@{/add_user_connection}" method="post">
				
				<div class="labelMail">
					<div class="messageError" role="alert" th:if="${emailError}" th:text="${emailError}"></div>
					<div class="messageOk" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
					<label for="email">Chercher une relation</label>
					<input type="email" id="email" name="email" placeholder="Saisir une adresse email" />
				</div>
				<div id="divButton">
					<button id="appendButton" type="submit">Ajouter</button>
				</div>
			</form>
		</main>
	</body>
</html>
